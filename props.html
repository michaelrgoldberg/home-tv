<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prop Tracker</title>
<style>
  :root{--line:#232d41;--muted:#9aa7c2;--gold:#ffcc00;--green:#2ec47a;--red:#e5533c;--blue:#4f9bff;--amber:#ffa52a;--ov:1;--sans:'Segoe UI',system-ui,Roboto,Arial,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:transparent;font-family:var(--sans);overflow:hidden;color:#eef3fb}
  #pp{width:100%;height:100%;background:linear-gradient(180deg,#0e1726,#0a0f1a);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 55px -18px #000;font-size:min(3.6vw,15px)}
  .hd{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(255,204,0,.12),transparent);flex:none}
  .hd .t{font-weight:800;letter-spacing:.09em;font-size:.74em;color:var(--gold)}
  .hd .nav{font-size:.72em;color:var(--muted);font-weight:700}
  .scroll{flex:1;overflow:auto;padding:7px 9px;display:flex;flex-direction:column;gap:7px}
  .list{display:flex;flex-direction:column;gap:7px}
  .chip{display:flex;align-items:center;gap:11px;background:#141d31;border:1px solid var(--line);border-radius:11px;padding:8px 11px;flex:none;position:relative;overflow:hidden}
  .chip.hit{background:linear-gradient(90deg,rgba(255,204,0,.22),rgba(46,196,122,.12));border-color:var(--gold)}
  .chip.bust{opacity:.6}
  .chip.sweat,.cchip.sweat{border-color:var(--amber);animation:sweat 1.1s infinite}
  @keyframes sweat{0%,100%{box-shadow:0 0 0 0 rgba(255,165,42,.55)}50%{box-shadow:0 0 0 5px rgba(255,165,42,0)}}
  .ring{position:relative;width:46px;height:46px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;transition:transform .25s}
  .ring .val.pop{transform:scale(1.45)}
  .info{flex:1;min-width:0}
  .info .nm{font-weight:700;font-size:.98em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info .ln{font-size:.8em;color:var(--muted);margin-top:1px}
  .info .ln b{color:#eef3fb}
  .info .ln .pace{margin-left:7px;color:#cdd7ee}
  .info .gm{font-size:.78em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px}
  .info .gm .clk{color:#cdd7ee;font-weight:700}
  .info .gm .clk.live{color:var(--green)}
  .info .gm .scr{color:#6f7d9b;font-size:.86em}
  .need{font-size:.82em;font-weight:700;text-align:right;flex:none;min-width:48px}
  .need .big{font-size:1.15em}
  .trophy{font-size:1.5em;flex:none;animation:pop .5s}
  @keyframes pop{0%{transform:scale(0) rotate(-20deg)}60%{transform:scale(1.4) rotate(10deg)}100%{transform:scale(1)}}
  .conf{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .conf i{position:absolute;top:-10px;width:6px;height:9px;opacity:.9;animation:fall 1.1s linear forwards}
  @keyframes fall{to{transform:translateY(80px) rotate(360deg);opacity:0}}
  .msg{padding:22px;text-align:center;color:var(--muted);font-size:.9em}
  .pulse{animation:pulse 1.3s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,204,0,.5)}50%{box-shadow:0 0 0 4px rgba(255,204,0,0)}}
  /* rise-up popup card (bottom-left) */
  #rise{position:fixed;left:14px;bottom:14px;width:min(70vw,340px);background:linear-gradient(180deg,#16203a,#0e1526);border:1px solid var(--gold);border-radius:14px;box-shadow:0 18px 50px -14px #000;display:flex;align-items:center;gap:12px;padding:11px 13px;transform:translateY(160%);opacity:0;transition:transform .5s cubic-bezier(.2,1.1,.3,1),opacity .4s;z-index:50}
  #rise.show{transform:translateY(0);opacity:var(--ov)}
  #rise .face{width:52px;height:52px;border-radius:50%;flex:none;background:#223049 center/cover;border:2px solid var(--gold)}
  #rise .rb{flex:1;min-width:0}
  #rise .rb .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  #rise .rb .nm{font-weight:800;font-size:1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  #rise .rb .delta{color:var(--green);font-weight:800;font-size:1.05em;flex:none}
  #rise .rb .tot{font-size:.84em;color:var(--muted);margin-top:1px}
  #rise .rb .tot b{color:#eef3fb}
  #rise .rb .play{font-size:.8em;color:#cdd7ee;margin-top:3px;line-height:1.25;max-height:2.5em;overflow:hidden}
  #rise .rring{flex:none}
  #rise.hit{border-color:var(--gold);background:linear-gradient(180deg,#2a2410,#16203a)}
  #rise.game{border-color:var(--blue)}
  #rise.game.final{border-color:var(--gold)}
  #rise.game.close{border-color:var(--amber);background:linear-gradient(180deg,#2a1d0e,#16203a)}
  #rise .gface{width:46px;height:46px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:26px;background:#16233c;border:1px solid var(--line);overflow:hidden}
  #rise .gface .lg2{display:flex;flex-direction:column;gap:2px;align-items:center}
  #rise .gface img{width:20px;height:20px;object-fit:contain;background:#fff;border-radius:50%}
  #rise .rb .tag{font-size:.72em;font-weight:800;letter-spacing:.06em;color:var(--blue);text-transform:uppercase}
  #rise.game.final .rb .tag{color:var(--gold)}
  #rise.game.close .rb .tag{color:var(--amber)}
  #rise.stack{border-color:var(--muted)}
  #rise .rb .line{font-size:.8em;color:#cdd7ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* notification history drawer */
  #hist{position:fixed;left:14px;bottom:14px;width:min(78vw,360px);max-height:70vh;overflow:hidden;background:linear-gradient(180deg,#16203a,#0e1526);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px -14px #000;padding:10px 12px;display:none;z-index:60;font-size:13px;opacity:var(--ov)}
  #hist.show{display:block}
  #hist .ht{font-weight:800;letter-spacing:.08em;color:var(--gold);font-size:.78em;margin-bottom:6px;display:flex;justify-content:space-between}
  #hist .ht span{color:var(--muted);font-weight:600;letter-spacing:0}
  #hist .hi{display:flex;gap:8px;padding:4px 0;border-top:1px solid var(--line);align-items:baseline}
  #hist .hi .tm{color:#6f7d9b;font-size:.82em;flex:none;min-width:44px}
  #hist .hi .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* corner (floating overlay) mode */
  body.corner{background:transparent}
  body.corner #pp{background:transparent;border:none;box-shadow:none;height:100%;font-size:14px;justify-content:flex-end}
  body.corner #pp .hd{display:none}
  body.corner #pp .scroll{padding:0;justify-content:flex-end;overflow:visible;gap:5px}
  body.corner .cchip,body.corner .pcard{opacity:var(--ov)}
  .cchip{display:flex;align-items:center;gap:7px;background:linear-gradient(180deg,#16203a,#0e1526);border:1px solid var(--line);border-radius:10px;padding:5px 8px;box-shadow:0 10px 30px -10px #000;position:relative;overflow:hidden;width:250px}
  .cchip.hit{border-color:var(--gold);background:linear-gradient(90deg,rgba(255,204,0,.22),#16203a)}
  .cface{width:30px;height:30px;border-radius:50%;flex:none;background:#223049 center/cover;border:1.5px solid #3a4a6b}
  .cring{position:relative;width:38px;height:38px;flex:none}
  .cring .cv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;transition:transform .25s}
  .cring .cv.pop{transform:scale(1.45)}
  .cinfo{flex:1;min-width:0;line-height:1.18}
  .cinfo .cnm{font-weight:700;font-size:.84em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cinfo .cnm .rem{margin-left:4px;font-weight:800}
  .cinfo .cnm .rem.go{color:var(--green)}.cinfo .cnm .rem.bust{color:var(--red)}
  .cinfo .cln{font-size:.72em;color:#cdd7ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cinfo .cln .pace{color:#9fb0d6;margin-left:5px}
  .cinfo .cst{font-size:.66em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cinfo .cst .clk{color:#cdd7ee;font-weight:700}.cinfo .cst .clk.live{color:var(--green)}
  .cinfo .cst .scr{color:#6f7d9b;margin-left:5px}
  .cchip .dpop{position:absolute;top:4px;right:8px;color:var(--green);font-weight:800;font-size:.8em;animation:dfade 2.6s forwards}
  @keyframes dfade{0%{opacity:0;transform:translateY(6px)}12%{opacity:1;transform:translateY(0)}80%{opacity:1}100%{opacity:0}}
  /* parlay card */
  .pcard{background:linear-gradient(180deg,#16203a,#0e1526);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 34px -12px #000;overflow:hidden}
  body.corner .pcard{width:250px}
  .pcard.won{border-color:var(--green);background:linear-gradient(180deg,#143326,#0e1526)}.pcard.lost{border-color:var(--red);opacity:.82}
  .pcard .phd{display:flex;align-items:center;gap:9px;padding:7px 10px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(255,204,0,.12),transparent)}
  .pcard .pring{position:relative;width:40px;height:40px;flex:none}
  .pcard .pring .pv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}
  .pcard .pi{flex:1;min-width:0;line-height:1.15}
  .pcard .pi .pn{font-weight:800;font-size:.86em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pcard .pi .po{font-size:.68em;color:#9fb0d6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pcard .pi .po b{color:var(--gold)}
  .pcard .plegs{padding:4px 6px;display:grid;grid-template-columns:1fr;gap:1px}
  body:not(.corner) .pcard .plegs{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px 14px;padding:6px 10px}
  .pleg{display:flex;align-items:center;gap:6px;font-size:.7em;padding:2px 4px;border-radius:6px}
  body:not(.corner) .pleg{font-size:.82em;padding:3px 4px}
  .pleg .ld{width:9px;height:9px;border-radius:50%;flex:none}
  .pleg .ln{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .pleg .ln .ll{color:#9fb0d6;font-weight:400;margin-left:3px}
  .pleg .lv{font-weight:800;flex:none}
  .pleg .lc{color:#6f7d9b;flex:none;font-size:.9em;min-width:34px;text-align:right}
  .pleg .lc.live{color:var(--green)}
  .pleg.won{color:#cfeede}.pleg.lost{color:#e79a8d}.pleg.lost .ln{text-decoration:line-through;opacity:.8}
  .pleg.sweat .ld{box-shadow:0 0 0 2px rgba(255,165,42,.6)}
  /* corner leg rail: one dot per leg + the leg in focus */
  .rail{display:flex;gap:4px;padding:6px 10px 2px;flex-wrap:wrap}
  .rail i{width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;font-style:normal;color:#0a0f1a;border:1px solid rgba(255,255,255,.12)}
  .rail i.on{outline:2px solid #fff;outline-offset:1px}
  .focus{display:flex;align-items:center;gap:7px;padding:3px 10px 7px;font-size:.74em}
  .focus .fn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .focus .fn .ll{color:#9fb0d6;font-weight:400;margin-left:4px}
  .focus .fv{font-weight:800}
  .focus .fc{color:#9fb0d6;font-size:.9em;flex:none}
</style></head>
<body>
<div id="pp"><div class="msg">Loading your props…</div></div>
<div id="rise"></div>
<div id="hist"></div>
<script src="follow.js"></script>
<script>
'use strict';
var ESPN='https://site.web.api.espn.com/apis/site/v2/sports/';
var CORNER=/[?&]corner/.test(location.search); // compact mode for the floating overlay
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

// overlay opacity (shared setting with Gamecast): 1 / .8 / .65
function applyOpacity(){ var o=parseFloat(lsGet('w2w.ovOpacity',1))||1; document.documentElement.style.setProperty('--ov', o); }
applyOpacity();

// --- decrypt props.json with the on-device key ---
function getKey(){ try{ return localStorage.getItem('w2w.key.priv')||''; }catch(e){ return ''; } }
function loadProps(){
  var key=getKey(); if(!key||!window.crypto||!crypto.subtle) return Promise.resolve({props:[],parlays:[]});
  var b=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});};
  return fetch('props.json?'+Date.now()).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(p){
    return crypto.subtle.importKey('raw',b(key),'AES-GCM',false,['decrypt']).then(function(k){ return crypto.subtle.decrypt({name:'AES-GCM',iv:b(p.iv)},k,b(p.ct)); });
  }).then(function(buf){ var a=JSON.parse(new TextDecoder().decode(buf)); if(Array.isArray(a)) return {props:a, parlays:[]}; return {props:a.props||[], parlays:a.parlays||[]}; }).catch(function(){ return {props:[], parlays:[]}; });
}

// --- stat extraction from ESPN box score ---
var STAT_MAP={ points:['PTS'], pts:['PTS'], rebounds:['REB','TOT'], reb:['REB'], assists:['AST'], ast:['AST'],
  steals:['STL'], blocks:['BLK'], turnovers:['TO'], threes:['3PT'], '3pm':['3PT'],
  goals:['G'], assists_nhl:['A'], shots:['SOG','S','SH'], saves:['SV'], points_nhl:['PTS','P'],
  hits:['H'], runs:['R'], rbis:['RBI'], rbi:['RBI'], 'home runs':['HR'], hr:['HR'], strikeouts:['K','SO'], 'total bases':['TB'],
  'passing yards':['YDS'], 'rushing yards':['YDS'], 'receiving yards':['YDS'], receptions:['REC'], rec:['REC'],
  'pass tds':['TD'], 'rush tds':['TD'], 'rec tds':['TD'], tackles:['TOT','TCKL'] };
var GROUP_HINT={ 'passing yards':'passing','pass tds':'passing','rushing yards':'rushing','rush tds':'rushing','receiving yards':'receiving','rec tds':'receiving','receptions':'receiving','rec':'receiving' };
function num(v){ if(v==null) return null; v=String(v); if(v.indexOf('-')>0 && /^\d+-\d+$/.test(v)) return parseInt(v.split('-')[0],10); var n=parseFloat(v.replace(/[^0-9.\-]/g,'')); return isNaN(n)?null:n; }
function statFromBox(d, playerName, stat){ // combo props ("points+rebounds") sum the parts
  var parts=String(stat||'').toLowerCase().split('+').map(function(s){return s.trim();}).filter(Boolean);
  if(parts.length>1){ var sum=0, any=false; for(var i=0;i<parts.length;i++){ var vv=singleStat(d,playerName,parts[i]); if(vv!=null){ sum+=vv; any=true; } } return any?sum:null; }
  return singleStat(d,playerName,stat);
}
function nameHit(nm,lname){ return nm && (nm.indexOf(lname)>=0 || lname.indexOf(nm)>=0); }
function singleStat(d, playerName, stat){
  var bs=d.boxscore||{}; var want=String(stat||'').toLowerCase().trim();
  var labelsWanted=STAT_MAP[want]||[want.toUpperCase()]; var groupHint=GROUP_HINT[want];
  var found=null, lname=playerName.toLowerCase();
  (bs.players||[]).forEach(function(tm){ (tm.statistics||[]).forEach(function(grp){
    if(groupHint && String(grp.name||grp.type||'').toLowerCase().indexOf(groupHint)<0) return;
    var labels=grp.labels||grp.names||[];
    (grp.athletes||[]).forEach(function(a){ var nm=((a.athlete||{}).displayName||(a.athlete||{}).shortName||'').toLowerCase(); if(!nameHit(nm,lname)) return;
      for(var i=0;i<labelsWanted.length;i++){ var li=labels.indexOf(labelsWanted[i]); if(li>=0){ var v=num((a.stats||[])[li]); if(v!=null){ found=v; return; } } } });
  }); });
  return found;
}
var CDN_LG={'basketball/nba':'nba','football/nfl':'nfl','hockey/nhl':'nhl','baseball/mlb':'mlb','basketball/mens-college-basketball':'mens-college-basketball'};
function headshotFrom(d, playerName){ var lname=playerName.toLowerCase(), hs='', aid='';
  (((d.boxscore||{}).players)||[]).forEach(function(tm){ (tm.statistics||[]).forEach(function(grp){ (grp.athletes||[]).forEach(function(a){
    var at=a.athlete||{}, nm=(at.displayName||at.shortName||'').toLowerCase(); if(!nameHit(nm,lname)) return;
    if(at.headshot){ hs=(typeof at.headshot==='string')?at.headshot:at.headshot.href||''; } if(at.id) aid=at.id; }); }); });
  return {hs:hs, id:aid};
}
function lastPlayFor(d, playerName){ var parts=playerName.toLowerCase().split(' '); var last=parts[parts.length-1];
  var plays=d.plays||[]; for(var i=plays.length-1;i>=0;i--){ var t=plays[i].text||''; if(t.toLowerCase().indexOf(last)>=0) return t; } return ''; }
function playerMeta(d, playerName){ var lname=playerName.toLowerCase(), min=0, pf=0;
  (((d.boxscore||{}).players)||[]).forEach(function(tm){ (tm.statistics||[]).forEach(function(grp){
    var labels=grp.labels||grp.names||[]; var mi=labels.indexOf('MIN'), fi=labels.indexOf('PF');
    (grp.athletes||[]).forEach(function(a){ var nm=((a.athlete||{}).displayName||(a.athlete||{}).shortName||'').toLowerCase(); if(!nameHit(nm,lname)) return;
      if(mi>=0){ var m=num((a.stats||[])[mi]); if(m!=null) min=m; } if(fi>=0){ var f=num((a.stats||[])[fi]); if(f!=null) pf=f; } }); }); });
  return {min:min, pf:pf};
}

// --- ESPN scoreboard / summary (cached) ---
var sbCache={};
function scoreboard(lg){ if(sbCache[lg] && Date.now()-sbCache[lg].t<12000) return Promise.resolve(sbCache[lg].e);
  return fetch(ESPN+lg+'/scoreboard').then(function(r){return r.json();}).then(function(d){ var e=d.events||[]; sbCache[lg]={t:Date.now(),e:e}; return e; }).catch(function(){ return (sbCache[lg]||{}).e||[]; }); }
function findGame(lg, team){ return scoreboard(lg).then(function(evs){
  var best=null, rank={in:0,pre:1,post:2};
  for(var i=0;i<evs.length;i++){ var c=(evs[i].competitions&&evs[i].competitions[0])||{}; var cs=c.competitors||[];
    for(var j=0;j<cs.length;j++){ var tm=cs[j].team||{}; if(tm.abbreviation===team || (tm.displayName||'').indexOf(team)>=0){ var st=evs[i].status||{}; var s=st.type.state;
      var g={id:evs[i].id, state:s, status:st.type.shortDetail, period:st.period||0, clock:st.displayClock||'', cs:cs, date:evs[i].date};
      if(!best||rank[s]<rank[best.state]) best=g; } } }
  return best; }); }
var summaryCache={};
function summary(lg,id){ if(summaryCache[id] && Date.now()-summaryCache[id].t<10000) return Promise.resolve(summaryCache[id].d);
  return fetch(ESPN+lg+'/summary?event='+id).then(function(r){return r.json();}).then(function(d){ summaryCache[id]={t:Date.now(),d:d}; return d; }).catch(function(){ return null; }); }

// --- settings ---
function getNotify(){ var o=lsGet('w2w.notify',{}); return {quiet:!!o.quiet, games:(o.games!==false)}; }
function isQuiet(){ return getNotify().quiet; }
function getStarred(){ var a=lsGet('w2w.starred',[]); return Array.isArray(a)?a:[]; }
function starLevel(id){ var m=lsGet('w2w.starLevel',{}); return +(m[id]||1); } // 1 key moments, 2 every score
function sportFromLg(lg){ if(/basketball/.test(lg))return'bk'; if(/football/.test(lg))return'fb'; if(/hockey/.test(lg))return'hk'; if(/baseball/.test(lg))return'bb'; if(/soccer/.test(lg))return'sc'; return'gen'; }
function perLabel(sp,p){ if(sp==='bk'){ return p<=4?('Q'+p):('OT'+(p>5?(p-4):'')); } if(sp==='hk'){ return p<=3?('P'+p):'OT'; } if(sp==='fb'){ return p<=4?('Q'+p):'OT'; } return 'Period '+p; }
function tipTime(iso){ try{ var d=new Date(iso); var h=d.getHours(), m=d.getMinutes(); return (h%12||12)+':'+(m<10?'0':'')+m+(h<12?'a':'p'); }catch(e){ return ''; } }

// --- state ---
var props=[], parlays=[], vals={}, pageTop=0, pollT=null;
var PAGE=4;

function needed(p){ return Math.floor(p.line)+1; }
function over(p){ return (p.dir||'o')==='o'; }
function statusOf(p, v){
  var line=p.line, ov=over(p);
  if(v==null) return {prog:0, hit:false, bust:false};
  if(ov){ var need=needed(p); return {prog:Math.min(1, v/need), hit:v>line, bust:false}; }
  var bust=v>line; var prog=Math.max(0, 1 - v/(Math.floor(line)+1)); return {prog:bust?0:prog, hit:false, bust:bust};
}
function ringColor(prog){ return 'hsl('+Math.round(prog*120)+',72%,48%)'; }
function probColor(prob){ return 'hsl('+Math.round(prob*120)+',74%,47%)'; }
function parseClock(s){ if(!s) return 0; var m=String(s).match(/(\d+):(\d+)/); if(m) return (+m[1])*60+(+m[2]); var n=parseFloat(s); return isNaN(n)?0:n; }
var SPORT_PERIODS={ bk:{n:4,len:12}, fb:{n:4,len:15}, hk:{n:3,len:20} };
function remGameMin(sp,per,cs){ var S=SPORT_PERIODS[sp]; if(!S) return null; if(per>S.n) return cs/60; return (S.n-per)*S.len + cs/60; }

  return findGame(p.lg,p.team).then(function(g){
    if(!g){ p._status='No game today'; p._score=''; p._live=false; return; }

    p._pre=false;

      var h=headshotFrom(d,p.player); var face=h.hs||(CDN_LG[p.lg]&&h.id?'https://a.espncdn.com/i/headshots/'+CDN_LG[p.lg]+'/players/full/'+h.id+'.png':''); if(face) p._face=face;

function allLegs(){ var r=[]; parlays.forEach(function(pl){ r=r.concat(pl.legs); }); return r; }

    parlays.forEach(function(pl){
      var prod=1; pl.legs.forEach(function(l){ prod*=(l._prob!=null?l._prob:0.5); });

      if(p._changed){ var vEl=$((CORNER?'cv-':'val-')+p.id); if(vEl){ vEl.classList.add('pop'); setTimeout(function(){vEl.classList.remove('pop');},260);} p._changed=false; }

    parlays.forEach(function(pl){
      if(pl._settled==='won' && !pl._celebrated){ pl._celebrated=true; showParlayHit(pl); }
      if(pl._settled==='lost' && !pl._mourned){ pl._mourned=true; var dead=pl.legs.filter(function(l){return settled(l)==='lost';})[0]; enqueueRise('<div class="gface">🎟️</div><div class="rb"><div class="tag" style="color:var(--red)">Parlay lost</div><div class="top"><span class="nm">'+esc(pl.name||'Parlay')+' '+esc(pl.odds||'')+'</span></div><div class="play">'+esc(dead?(dead.disp+' '+dead.label+' missed'):'')+'</div></div>','game',6500,'✗ '+(pl.name||'Parlay')+' lost'); }
    });
    var anyLive=items.some(function(p){ return p._live; });
    pollT=setTimeout(poll, anyLive?12000:45000);
  });
}

// ---------- popups: queue, stacking, history ----------
var riseT=null, riseQ=[], riseBusy=false, histLog=lsGet('w2w.notifyLog',[]);
function logNote(text){ if(!text) return; histLog.unshift({t:Date.now(), x:text}); histLog=histLog.slice(0,12); lsSet('w2w.notifyLog',histLog); }
function enqueueRise(html, cls, dur, logText){
  logNote(logText);
  riseQ.push({html:html, cls:cls||'', dur:dur||6500, log:logText||''});
  // 3+ waiting -> collapse into one "N updates" card instead of a long serial stream
  if(riseQ.length>=3){ var lines=riseQ.map(function(q){ return q.log; }).filter(Boolean); riseQ=[{html:'<div class="gface">📣</div><div class="rb"><div class="tag" style="color:var(--muted)">'+lines.length+' updates</div>'+lines.slice(0,4).map(function(x){ return '<div class="line">'+esc(x)+'</div>'; }).join('')+(lines.length>4?'<div class="line" style="color:#6f7d9b">+'+(lines.length-4)+' more · ◂ for history</div>':'')+'</div>', cls:'stack', dur:7500}]; }
  pumpRise();
}
function pumpRise(){ if(riseBusy) return; var it=riseQ.shift(); if(!it) return; var r=$('rise'); if(!r) return;
  riseBusy=true; r.className=it.cls; r.innerHTML=it.html; void r.offsetWidth; r.classList.add('show');
  clearTimeout(riseT); riseT=setTimeout(function(){ r.classList.remove('show'); setTimeout(function(){ riseBusy=false; pumpRise(); }, 420); }, it.dur);
}
function showRise(p){
  if(p.kind&&p.kind!=='prop'){ var tg=(p.kind==='total'?'Total':p.kind==='ml'?'Moneyline':'Spread')+' · '+(p._status||''); enqueueRise('<div class="gface">'+({bk:'🏀',fb:'🏈',hk:'🏒',bb:'⚾',sc:'⚽'}[p.sport]||'📣')+'</div><div class="rb"><div class="tag">'+esc(tg)+'</div><div class="top"><span class="nm">'+esc(p.disp||p.label||'')+'</span><span class="delta" style="color:'+(p._lineEdge>0?'var(--green)':'var(--red)')+'">'+esc(lineValTxt(p))+'</span></div><div class="tot">'+esc(p._score||'')+' · '+esc(lineEdgeTxt(p))+'</div></div>','game',5500,(p.disp||p.label)+' '+lineValTxt(p)+' · '+lineEdgeTxt(p)); return; }
  var isProp=props.indexOf(p)>=0;
  if(CORNER && !isQuiet() && isProp){ // persistent-chip mode: flash in place
    rotI=props.indexOf(p); render();
    var chip=document.querySelector('#pp .cchip');
    if(chip){ var st0=statusOf(p,p._newVal); var d=document.createElement('div'); d.className='dpop'; d.textContent=st0.hit?'🏆 HIT!':'+'+p._delta+' '+(p.statLabel||p.stat); chip.appendChild(d); }
    logNote((p.disp||p.player)+' +'+p._delta+' '+(p.statLabel||p.stat)+' → '+p._newVal);
    return;
  }
  var st=statusOf(p, p._newVal);
  var C=44,R=18,circ=2*Math.PI*R,off=circ*(1-st.prog);
  var color=st.hit?'var(--gold)':ringColor(st.prog);
  var face=p._face? '<div class="face" style="background-image:url(&quot;'+esc(p._face)+'&quot;)"></div>' : '<div class="face"></div>';
  var ring='<div class="rring"><svg width="'+C+'" height="'+C+'" viewBox="0 0 '+C+' '+C+'" style="transform:rotate(-90deg)"><circle cx="22" cy="22" r="'+R+'" fill="none" stroke="#1e283c" stroke-width="4.5"/><circle cx="22" cy="22" r="'+R+'" fill="none" stroke="'+color+'" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="'+circ.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg></div>';
  var sl=p.statLabel||p.stat;
  var html=face+'<div class="rb"><div class="top"><span class="nm">'+esc(p.disp||p.player)+'</span><span class="delta">'+(st.hit?'🏆 HIT!':'+'+p._delta+' '+esc(sl))+'</span></div><div class="tot"><b>'+p._newVal+'</b> '+esc(sl)+' · '+(st.hit?'prop hit!':('+'+(needed(p)-p._newVal)+' to go'))+'</div>'+(p._play?'<div class="play">'+esc(p._play)+'</div>':'')+'</div>'+ring;
  enqueueRise(html, st.hit?'hit':'', st.hit?9000:6500, (p.disp||p.player)+' +'+p._delta+' '+sl+' → '+p._newVal+(st.hit?' ✓ HIT':''));
}
function showParlayHit(pl){
  enqueueRise('<div class="gface" style="font-size:30px">🏆</div><div class="rb"><div class="tag" style="color:var(--gold)">Parlay hit</div><div class="top"><span class="nm">'+esc(pl.name||'Parlay')+'</span><span class="delta" style="color:var(--gold)">'+esc(pl.odds||'')+'</span></div><div class="tot">All '+pl.legs.length+' legs cleared</div></div>', 'hit', 12000, '🏆 '+(pl.name||'Parlay')+' '+(pl.odds||'')+' HIT');
}
function showGameRise(cs, scoreStr, tag, detail, sp, kind){
  var emo={bk:'🏀',fb:'🏈',hk:'🏒',bb:'⚾',sc:'⚽'}[sp]||'📣';
  var logos=cs.map(function(x){ return ((x.team||{}).logo)||''; }).filter(Boolean);
  var face = logos.length===2 ? '<div class="gface"><div class="lg2"><img src="'+esc(logos[0])+'"><img src="'+esc(logos[1])+'"></div></div>' : '<div class="gface">'+emo+'</div>';
  var html=face+'<div class="rb"><div class="tag">'+esc(tag)+'</div><div class="top"><span class="nm">'+esc(scoreStr)+'</span></div>'+(detail?'<div class="play">'+esc(detail)+'</div>':'')+'</div>';
  enqueueRise(html, 'game'+(kind?' '+kind:''), kind==='final'?8000:kind==='close'?8000:6000, tag+' · '+scoreStr);
}
function showHistory(){ var h=$('hist'); if(!h) return;
  var rows=histLog.map(function(n){ var d=new Date(n.t); return '<div class="hi"><span class="tm">'+(d.getHours()%12||12)+':'+('0'+d.getMinutes()).slice(-2)+'</span><span class="tx">'+esc(n.x)+'</span></div>'; }).join('')||'<div class="hi"><span class="tx" style="color:var(--muted)">No updates yet tonight</span></div>';
  h.innerHTML='<div class="ht">RECENT UPDATES <span>any key to close</span></div>'+rows; h.classList.add('show');
  clearTimeout(showHistory._t); showHistory._t=setTimeout(function(){ h.classList.remove('show'); }, 9000); }
function hideHistory(){ var h=$('hist'); if(h) h.classList.remove('show'); }

// ---------- followed-game alerts ----------
var gstate={}, gPollT=null;
function closeThreshold(sp){ return {bk:5, fb:8, hk:1, sc:1, bb:2}[sp]||3; }
function pollGames(){
  clearTimeout(gPollT);
  var nf=getNotify(), st=getStarred();
  if(!nf.games || !st.length){ gPollT=setTimeout(pollGames, 60000); return; }
  var lgs=[]; st.forEach(function(s){ if(lgs.indexOf(s.lg)<0) lgs.push(s.lg); });
  Promise.all(lgs.map(scoreboard)).then(function(res){
    var byLg={}; lgs.forEach(function(lg,i){ byLg[lg]=res[i]||[]; });
    var anyLive=false;
    st.forEach(function(s){
      var evs=byLg[s.lg]||[], e=null;
      for(var i=0;i<evs.length;i++){ if(String(evs[i].id)===String(s.id)){ e=evs[i]; break; } }
      if(!e) return;
      var c=(e.competitions&&e.competitions[0])||{}; var cs=c.competitors||[]; var stt=e.status||{}; var ty=stt.type||{};
      var state=ty.state, period=stt.period||0, clk=parseClock(stt.displayClock||''), sp=sportFromLg(s.lg), lvl=starLevel(String(e.id));
      if(state==='in') anyLive=true;
      var scores=cs.map(function(x){ return +(x.score||0); }); var sum=scores[0]+(scores[1]||0), margin=Math.abs(scores[0]-(scores[1]||0));
      var scoreStr=cs.map(function(x){ return ((x.team||{}).abbreviation||'')+' '+(x.score!=null?x.score:'0'); }).join('  ');
      var lastPlay=((c.situation||{}).lastPlay||{}).text||'';
      var g=gstate[s.id];
      if(!g){ gstate[s.id]={state:state, period:period, score:sum, half:false, finaled:(state==='post'), closed:false}; return; }
      if(g.state==='pre' && state==='in'){ showGameRise(cs,scoreStr,'Tip-off','Game started',sp,''); }
      if(state==='in'){
        var every = (lvl>=2) || !(sp==='bk'||sp==='fb');
        if(every){ if(sum>g.score) showGameRise(cs,scoreStr,'Score',lastPlay,sp,''); }
        else {
          if(period>g.period && g.period>=1){ showGameRise(cs,scoreStr,'End '+perLabel(sp,g.period),lastPlay,sp,''); g.half=false; }
          else if(period===g.period && !g.half && clk>0 && clk<=(sp==='bk'?360:450)){ showGameRise(cs,scoreStr,perLabel(sp,period)+' halfway',lastPlay,sp,''); g.half=true; }
        }
        // close & late: one alert per game, regardless of cadence
        var S=SPORT_PERIODS[sp]; var late = S ? (period>=S.n && clk>0 && clk<=180) : (sp==='bb' ? period>=8 : period>=2 && clk<=600);
        if(late && margin<=closeThreshold(sp) && !g.closed){ g.closed=true; showGameRise(cs,scoreStr,'Close game · '+(S?perLabel(sp,period)+' '+Math.floor(clk/60)+':'+('0'+(clk%60)).slice(-2):''),lastPlay,sp,'close'); }
      }
      if(state==='post' && !g.finaled){ showGameRise(cs,scoreStr,'Final',lastPlay,sp,'final'); g.finaled=true; }
      if(period!==g.period) g.half=false;
      g.state=state; g.period=period; g.score=sum;
    });
    gPollT=setTimeout(pollGames, anyLive?15000:45000);
  }).catch(function(){ gPollT=setTimeout(pollGames, 45000); });
}

// ---------- keys / wiring ----------
document.addEventListener('keydown',function(e){
  var k=e.keyCode||e.which;
  if($('hist').classList.contains('show')){ hideHistory(); e.preventDefault(); return; }
  if(CORNER && (k===37||k===38)){ showHistory(); e.preventDefault(); return; }
  if(!CORNER){ var sc=document.querySelector('#pp .scroll'); if(sc){ if(k===40||k===39){ sc.scrollTop+=140; e.preventDefault(); } else if(k===38||k===37){ sc.scrollTop-=140; e.preventDefault(); } } }
});
window.addEventListener('storage', function(e){ if(!e.key || /^w2w\.(notify|propMode|starred|starLevel|ovOpacity|settingsRev)$/.test(e.key)){ applyOpacity(); render(); clearTimeout(gPollT); pollGames(); } });
window.W2W_BACK=function(){ if(CORNER) return false; try{ history.back(); }catch(e){ location.href='./'; } return true; };
function reloadAll(){ return loadProps().then(function(d){ props=d.props||[]; parlays=d.parlays||[]; poll(); }); }
window.PROPS={ reload:reloadAll, history:showHistory, next:function(){}, prev:function(){} };

if(CORNER){ document.body.classList.add('corner');
  (function cyc(){ var pm=getPropMode(); var vc=visCount(); var n=cornerItems().length; focusTick++;
    if(pm.m!=='all' && n>vc){ rotI=(rotI+vc)%n; } render();
    setTimeout(cyc, Math.max(4, pm.sec)*1000);
  })();
}
// boot: sync followed games (tell-Claude-to-track + prop/parlay games), then load
function boot(){ var p=(window.W2W_FOLLOW?W2W_FOLLOW.sync():Promise.resolve()); return p.catch(function(){}).then(reloadAll).then(function(){ clearTimeout(gPollT); pollGames(); }); }
boot();
setInterval(function(){ if(window.W2W_FOLLOW) W2W_FOLLOW.sync().then(function(r){ if(r&&r.added){ clearTimeout(gPollT); pollGames(); } }); }, 5*60*1000);
setInterval(reloadAll, 10*60*1000); // pick up new props/parlays Mike sends during the night
</script>
