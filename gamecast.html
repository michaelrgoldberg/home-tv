<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gamecast</title>
<style>
  :root{--line:#232d41;--muted:#9aa7c2;--gold:#ffcc00;--green:#2ec47a;--red:#e5533c;--blue:#4f9bff;--amber:#ffa52a;--ov:1;--sans:'Segoe UI',system-ui,Roboto,Arial,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:transparent;font-family:var(--sans);overflow:hidden}
  #gc{width:100%;height:100%;background:linear-gradient(180deg,#0e1726,#0a0f1a);border:1px solid var(--line);border-radius:14px;overflow:hidden;color:#eef3fb;box-shadow:0 20px 55px -18px #000;display:flex;flex-direction:column;font-size:min(3.6vw,15px);opacity:var(--ov)}
  .hd{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(255,204,0,.12),transparent);flex:none;gap:8px}
  #gc.hot .hd{background:linear-gradient(90deg,rgba(229,83,60,.45),rgba(229,83,60,.08));border-bottom-color:#7a2a1f}
  #gc.close .hd{background:linear-gradient(90deg,rgba(255,165,42,.42),rgba(255,165,42,.06));border-bottom-color:#7a5a1f}
  .hd .lg{font-weight:800;letter-spacing:.09em;font-size:.72em;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #gc.hot .hd .lg,#gc.close .hd .lg{color:#fff}
  .hd .lev{font-size:.68em;font-weight:800;letter-spacing:.06em;color:#fff;background:rgba(0,0,0,.25);border-radius:5px;padding:1px 6px;white-space:nowrap}
  .hd .status{font-size:.72em;font-weight:700;display:flex;align-items:center;gap:5px;flex:none;color:var(--muted);margin-left:auto}
  .hd .status.live{color:var(--red)}#gc.hot .hd .status.live,#gc.close .hd .status.live{color:#fff}
  .hd .status .dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.1s infinite}#gc.hot .dot,#gc.close .dot{background:#fff}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .tm{display:flex;align-items:center;gap:9px;padding:5px 12px;flex:none}
  .tm .lgo{width:26px;height:26px;border-radius:50%;background:#fff;object-fit:contain;flex:none;padding:2px}
  .tm .ab{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex:none}
  .tm .nm{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;min-width:0}
  .tm .nm .rec{color:var(--muted);font-size:.78em;font-weight:400}
  .tm .nm .run{color:var(--gold);font-size:.72em;font-weight:800;background:rgba(255,204,0,.12);border:1px solid rgba(255,204,0,.35);border-radius:5px;padding:0 5px;white-space:nowrap}
  .tm .pos{color:var(--gold);font-size:.95em;flex:none}
  .tm .pts{font-size:1.7em;font-weight:300;min-width:30px;text-align:right}
  .tm.lose{opacity:.55}
  .meta{display:flex;gap:10px;padding:0 12px 4px;font-size:.68em;color:var(--muted);flex:none;flex-wrap:wrap}
  .meta b{color:#dfe7f6;font-weight:700}
  .meta .bon{color:var(--amber);font-weight:800}
  .sit{border-top:1px solid var(--line);padding:7px 12px;flex:1;overflow:hidden;min-height:0}
  .chip{display:inline-flex;align-items:center;gap:4px;background:#182134;border:1px solid var(--line);border-radius:7px;padding:2px 7px;font-size:.78em;margin:2px 3px 2px 0;max-width:100%}
  .chip b{color:#fff}
  .chip.playtxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .last{border-top:1px solid var(--line);padding:5px 12px;font-size:.78em;color:var(--muted);display:flex;align-items:center;gap:7px;flex:none;min-height:28px}
  .last .txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .last .nav{margin-left:auto;color:var(--gold);font-size:.92em;font-weight:600;flex:none;display:flex;align-items:center;gap:6px}
  .last .dots{display:flex;gap:3px}.last .dots i{width:5px;height:5px;border-radius:50%;background:#3a4a6b}.last .dots i.on{background:var(--gold)}
  .wp{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:.78em}
  .wp .bar{flex:1;height:7px;border-radius:5px;overflow:hidden;display:flex;background:#1b2436}
  .wp .bar i{height:100%;transition:width .9s}
  .wp .pct{font-weight:700;min-width:30px}
  .bbw{display:flex;gap:10px;align-items:flex-start}
  .diamond{width:54px;height:54px;position:relative;flex:none;margin-top:2px}
  .diamond .b{position:absolute;width:13px;height:13px;background:#223049;border:1.5px solid #3b4a6b;transform:rotate(45deg)}
  .diamond .b.on{background:var(--gold);border-color:#fff}
  .diamond .b2{top:0;left:20px}.diamond .b1{top:20px;right:0}.diamond .b3{top:20px;left:0}
  .zone{width:50px;height:64px;position:relative;background:#0a1019;border:1px solid #2b3550;border-radius:4px;flex:none}
  .zone .grid{position:absolute;inset:10px 8px 16px 8px;border:1.5px solid rgba(255,255,255,.5)}
  .zone .grid:before{content:"";position:absolute;left:33%;right:33%;top:0;bottom:0;border-left:1px solid rgba(255,255,255,.22);border-right:1px solid rgba(255,255,255,.22)}
  .zone .grid:after{content:"";position:absolute;top:33%;bottom:33%;left:0;right:0;border-top:1px solid rgba(255,255,255,.22);border-bottom:1px solid rgba(255,255,255,.22)}
  .zone .bs{position:absolute;top:8px;bottom:14px;width:5px;border-radius:3px;background:var(--gold);box-shadow:0 0 8px rgba(255,204,0,.8)}
  .zone .bs.l{left:1px}.zone .bs.r{right:1px}
  .cnt{font-size:.78em;display:flex;flex-direction:column;gap:4px;min-width:0}
  .cnt .r{display:flex;align-items:center;gap:5px}.cnt .r span{width:12px;color:var(--muted);font-weight:700}
  .pip{width:8px;height:8px;border-radius:50%;background:#26324a;border:1px solid #3a4a6b}
  .pip.b{background:var(--green);border-color:var(--green)}.pip.s{background:var(--gold);border-color:var(--gold)}.pip.o{background:var(--red);border-color:var(--red)}
  .field{position:relative;height:46px;border-radius:5px;overflow:hidden;border:1px solid #1f3a28;margin-top:2px}
  .field .turf{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#123a23 0 9.09%,#0f3420 9.09% 18.18%)}
  .field .ez{position:absolute;top:0;bottom:0;width:9%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:800;color:rgba(255,255,255,.85);writing-mode:vertical-rl}
  .field .los{position:absolute;top:0;bottom:0;width:2px;background:var(--blue);transition:left .8s}
  .field .fd{position:absolute;top:0;bottom:0;width:2px;background:var(--gold);transition:left .8s}
  .field .ball{position:absolute;top:50%;width:11px;height:7px;background:#7a4a22;border:1px solid #c98b4a;border-radius:50%;transform:translate(-50%,-50%);transition:left .8s}
  .msg{padding:20px;text-align:center;color:var(--muted);font-size:.9em}
  .pbp{font-size:.82em;color:#c7d0e4;display:grid;gap:5px;overflow:auto;max-height:100%}
  .pbp .h{font-size:.82em;font-weight:800;letter-spacing:.08em;color:var(--gold);margin:8px 0 3px}
  .pbp .pl{display:flex;gap:7px}.pbp .pl .sc{color:var(--muted);margin-left:auto;white-space:nowrap}
  .ls{margin-top:8px;font-size:.74em}
  .ls .lr{display:flex;align-items:center}
  .ls .c{flex:1;text-align:center;padding:1px 0}
  .ls .c.nm{flex:0 0 46px;text-align:left;font-weight:700}
  .ls .c.tot{font-weight:800;color:#fff}
  .ls .lr.h .c{color:var(--muted);font-size:.9em}
.tabs{display:flex;gap:4px;padding:5px 10px 0;font-size:.66em;font-weight:800;letter-spacing:.06em;flex:none;align-items:center}
  .tabs span{padding:3px 8px;border-radius:6px;color:var(--muted);background:#121a2c;border:1px solid var(--line)}
  .tabs span.on{color:#111;background:var(--gold);border-color:var(--gold)}
  .tabs .hint{margin-left:auto;background:none;border:none;color:#5e6b88;font-weight:600;letter-spacing:0}
  .box{font-size:.7em;margin-bottom:8px;font-variant-numeric:tabular-nums}
  .box .br{display:grid;grid-template-columns:minmax(86px,1.6fr) repeat(var(--n),minmax(28px,1fr));gap:0 4px;align-items:center;padding:3px 2px;border-bottom:1px solid #141c2e}
  .box .br.h{color:var(--gold);font-weight:800;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0d1524;z-index:1}
  .box .br.st .bn{font-weight:700}
  .box .br.dnp{color:#55627f}
  .box .br.tot{color:#fff;font-weight:800;border-top:1px solid var(--line);background:#101a2c}
  .box .bn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .box .bn i{font-style:normal;color:#6f7d9b;font-size:.85em;margin-left:2px}
  .box .bc{text-align:right;white-space:nowrap}
  .ts{display:grid;grid-template-columns:1fr 2fr 1fr;font-size:.74em;padding:4px 2px;border-bottom:1px solid #141c2e;font-variant-numeric:tabular-nums}
  .ts span:first-child{text-align:left}.ts span:last-child{text-align:right}.ts .l{text-align:center;color:var(--muted)}
  .ts .w{color:#fff;font-weight:800}
  .ts.h{font-weight:800;letter-spacing:.06em;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0d1524}
  .key{margin-top:6px;font-size:.78em;color:#cdd7ee;display:flex;flex-direction:column;gap:3px}
  .key b{color:#fff}.key .lab{color:var(--muted);font-size:.9em;margin-right:5px}
</style></head>
<body>
<div id="gc"><div class="msg">Loading your games…</div></div>
<script src="follow.js"></script>
<script>
'use strict';
var ESPN='https://site.web.api.espn.com/apis/site/v2/sports/';
function $(id){return document.getElementById(id);}
function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }
function getStarred(){ var a=lsGet('w2w.starred',[]); return Array.isArray(a)?a:[]; }
function starLevel(id){ var m=lsGet('w2w.starLevel',{}); return +(m[id]||1); }
function col(t){ var c=t&&t.color; return '#'+((c&&/^[0-9a-f]{6}$/i.test(c))?c:'334155'); }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function trunc(s,n){ s=String(s||''); return s.length>n?s.slice(0,n-1)+'…':s; }
function parseClock(s){ if(!s) return 0; var m=String(s).match(/(\d+):(\d+)/); if(m) return (+m[1])*60+(+m[2]); var n=parseFloat(s); return isNaN(n)?0:n; }
function applyOpacity(){ var o=parseFloat(lsGet('w2w.ovOpacity',1))||1; document.documentElement.style.setProperty('--ov', o); }
applyOpacity();

var games=[], idx=0, expanded=false, cur=null, pollT=null, sumCache={}, promoted={}, tab=0, scrollPos=0;

function sportOf(lg){ if(/football/.test(lg))return'fb'; if(/baseball/.test(lg))return'bb'; if(/basketball/.test(lg))return'bk'; if(/hockey/.test(lg))return'hk'; if(/soccer/.test(lg))return'sc'; if(/tennis/.test(lg))return'tn'; return'gen'; }
var LGNAME={'football/nfl':'NFL','basketball/nba':'NBA','baseball/mlb':'MLB','hockey/nhl':'NHL','football/college-football':'NCAAF','basketball/mens-college-basketball':'NCAAM','basketball/womens-college-basketball':'NCAAW','soccer/usa.1':'MLS'};
function lgLabel(lg){ return (LGNAME[lg]||lg.split('/').pop().replace(/[-.]/g,' ').toUpperCase())+' · GAMECAST'; }
var FINAL_PERIOD={bk:4,fb:4,hk:3};

function loadScoreboards(leagues){
  return Promise.all(leagues.map(function(lg){
    return fetch(ESPN+lg+'/scoreboard').then(function(r){return r.json();}).then(function(d){ return {lg:lg, events:d.events||[]}; }).catch(function(){ return {lg:lg, events:[]}; });
  })).then(function(arr){ var m={}; arr.forEach(function(x){ m[x.lg]=x.events; }); return m; });
}
function normalize(lg, e){
  var comp=(e.competitions&&e.competitions[0])||{};
  var cs=comp.competitors||[]; if(cs.length<2) return null;
  var home=cs.filter(function(x){return x.homeAway==='home';})[0]||cs[0];
  var away=cs.filter(function(x){return x.homeAway==='away';})[0]||cs[1];
  var stt=(e.status&&e.status.type)||(comp.status&&comp.status.type)||{};
  var state=stt.state||'pre';
  var sit=comp.situation||{};
  function rec(t){ var r=(t.records||[]).filter(function(x){return x.type==='total'||x.name==='overall';})[0]||(t.records||[])[0]; return r?r.summary:''; }
  function team(t,isHome){ var tm=t.team||{}; return {ab:tm.abbreviation||'',name:tm.shortDisplayName||tm.name||tm.displayName||'',score:(t.score!=null?t.score:''),
    logo:tm.logo||(tm.logos&&tm.logos[0]&&tm.logos[0].href)||'', color:tm.color||'', id:tm.id, rec:rec(t),
    ls:(t.linescores||[]).map(function(x){return x.displayValue!=null?x.displayValue:x.value;}),
    poss:sit.possession&&sit.possession===tm.id, winner:t.winner, to:(isHome?sit.homeTimeouts:sit.awayTimeouts) }; }
  var sp=sportOf(lg), per=(e.status&&e.status.period)||0, clk=parseClock(e.status&&e.status.displayClock);
  var a=+(away.score||0), h=+(home.score||0), margin=Math.abs(a-h);
  var fin=FINAL_PERIOD[sp]; var late = fin ? (per>=fin && clk>0 && clk<=180) : false;
  var closeLate = state==='in' && late && margin<=({bk:5,fb:8,hk:1}[sp]||3);
  var hot = state==='in' && ( (sp==='fb'&&sit.isRedZone) || (sp==='bb'&&(sit.onSecond||sit.onThird)) || (sp==='hk'&&/power play|man adv/i.test((sit.lastPlay&&sit.lastPlay.text)||'')) );
  return { lg:lg, id:e.id, sport:sp, league:lgLabel(lg), state:state, period:per, clock:clk,
    statusTxt:stt.shortDetail||stt.detail||stt.description||'', detail:stt.detail||'',
    away:team(away,false), home:team(home,true), sit:sit, last:(sit.lastPlay&&sit.lastPlay.text)||'', closeLate:closeLate, hot:hot, level:starLevel(String(e.id)) };
}

function teamRow(t, loser, g){
  var logo=t.logo?'<img class="lgo" src="'+esc(t.logo)+'" onerror="this.style.visibility=\'hidden\'">':'<span class="ab" style="background:'+col(t)+'">'+esc(t.ab)+'</span>';
  var run=(g&&g.state==='in'&&g.run&&g.run.team===t.id&&g.run.pts>=(g.sport==='bk'?8:10))?'<span class="run">'+g.run.pts+'–0 run</span>':'';
  var possIcon = t.poss ? '<span class="pos" title="possession">'+(g&&g.sport==='fb'?'🏈':'●')+'</span>' : '';
  return '<div class="tm'+(loser?' lose':'')+'">'+logo+'<span class="nm"><span style="overflow:hidden;text-overflow:ellipsis">'+esc(t.name)+'</span>'+(t.rec?'<span class="rec">'+esc(t.rec)+'</span>':'')+run+'</span>'+possIcon+'<span class="pts">'+esc(t.score)+'</span></div>';
}
// team fouls (from summary) and timeouts (NFL scoreboard) — shown only when the feed provides them
function metaRow(g){ var parts=[]; var s=sumCache[g.id]||{};
  if(g.state!=='in') return '';
  if(s.fouls){ parts.push('<span>Fouls <b>'+esc(g.away.ab)+'</b> '+s.fouls.away+' · <b>'+esc(g.home.ab)+'</b> '+s.fouls.home+'</span>'); }
  if(g.away.to!=null||g.home.to!=null){ parts.push('<span>TO <b>'+esc(g.away.ab)+'</b> '+(g.away.to!=null?g.away.to:'–')+' · <b>'+esc(g.home.ab)+'</b> '+(g.home.to!=null?g.home.to:'–')+'</span>'); }
  return parts.length?'<div class="meta">'+parts.join('')+'</div>':'';
}
function statusLine(g){ var live=g.state==='in'; return '<span class="status'+(live?' live':'')+'">'+(live?'<span class="dot"></span>':'')+esc(g.statusTxt||(g.state==='post'?'Final':''))+'</span>'; }
function levTag(g){ if(g.closeLate) return '<span class="lev">CLOSE · LATE</span>'; if(g.hot){ return '<span class="lev">'+(g.sport==='fb'?'RED ZONE':g.sport==='bb'?'RISP':'POWER PLAY')+'</span>'; } return ''; }
function wpBar(g){ if(!g.wp) return ''; return '<div class="wp"><span class="pct" style="color:'+col(g.away)+'">'+g.wp.away+'%</span><div class="bar"><i style="width:'+g.wp.away+'%;background:'+col(g.away)+'"></i><i style="width:'+g.wp.home+'%;background:'+col(g.home)+'"></i></div><span class="pct" style="text-align:right;color:'+col(g.home)+'">'+g.wp.home+'%</span></div>'; }

function batterHand(s){
  var a=(s.batter&&s.batter.athlete)||{}; var h=String(a.bats||a.batHand||a.handedness||a.bat||'').toUpperCase();
  if(h.charAt(0)==='L') return 'L'; if(h.charAt(0)==='R') return 'R';
  if(h.charAt(0)==='S'||h.charAt(0)==='B'){ var p=(s.pitcher&&s.pitcher.athlete)||{}; var ph=String(p.throws||p.throwHand||p.hand||'').toUpperCase(); return ph.charAt(0)==='L'?'R':'L'; }
  return 'R';
}
function sitHTML(g){
  var s=g.sit||{};
  if(g.state==='pre'){ return '<span class="chip">'+esc(g.statusTxt||'Scheduled')+'</span>'; }
  if(g.state==='post'){ return '<span class="chip">Final</span>'+keyStats(g)+lscore(g); }
  if(g.sport==='bb'){
    function pips(n,on,cls){var o='';for(var i=0;i<n;i++)o+='<span class="pip '+(i<on?cls:'')+'"></span>';return o;}
    var bat=(s.batter&&s.batter.athlete&&(s.batter.athlete.shortName||s.batter.athlete.displayName))||'';
    var pit=(s.pitcher&&s.pitcher.athlete&&(s.pitcher.athlete.shortName||s.pitcher.athlete.displayName))||'';
    return '<div class="bbw"><div class="diamond"><div class="b b2'+(s.onSecond?' on':'')+'"></div><div class="b b1'+(s.onFirst?' on':'')+'"></div><div class="b b3'+(s.onThird?' on':'')+'"></div></div>'+
      '<div class="zone"><div class="grid"></div><div class="bs '+(batterHand(s)==='L'?'r':'l')+'"></div></div>'+
      '<div class="cnt"><div class="r"><span>B</span>'+pips(4,s.balls||0,'b')+'</div><div class="r"><span>S</span>'+pips(3,s.strikes||0,'s')+'</div><div class="r"><span>O</span>'+pips(3,s.outs||0,'o')+'</div>'+
      (bat?'<div style="margin-top:2px"><b>'+esc(bat)+'</b></div>':'')+(pit?'<div style="color:#9aa7c2">P '+esc(pit)+'</div>':'')+'</div></div>';
  }
  if(g.sport==='fb'){
    var dd=s.shortDownDistanceText||s.downDistanceText||'', spot=s.possessionText||'', rz=s.isRedZone;
    var yl=(s.yardLine!=null)?Math.max(0,Math.min(100,s.yardLine)):50, ball=9+((100-yl)/100)*82;
    var fd=ball+(s.distance?Math.min(20,s.distance):10)*0.82;
    return '<div class="field"><div class="turf"></div><div class="ez" style="left:0;background:'+col(g.away)+'">'+esc(g.away.ab)+'</div><div class="ez" style="right:0;background:'+col(g.home)+'">'+esc(g.home.ab)+'</div>'+
      '<div class="los" style="left:'+ball+'%"></div><div class="fd" style="left:'+Math.min(99,fd)+'%"></div><div class="ball" style="left:'+ball+'%"></div></div>'+
      '<div style="margin-top:6px">'+(dd?'<span class="chip" '+(rz?'style="border-color:#e5533c"':'')+'><b>'+esc(dd)+'</b></span>':'')+(spot?'<span class="chip">'+esc(spot)+'</span>':'')+'</div>';
  }
  var extra='';
  if(g.sport==='hk'){ var m=g.last.match(/power play|man adv|penalty/i); if(m) extra='<span class="chip" style="color:#ffcc00">⚡ '+esc(m[0])+'</span>'; }
  return (g.last?'<div class="chip playtxt">'+esc(g.last)+'</div>':'')+extra+lscore(g);
}
function lscore(g){
  var a=g.away.ls||[], h=g.home.ls||[], n=Math.max(a.length,h.length); if(!n) return '';
  var head=''; for(var i=0;i<n;i++) head+='<span class="c">'+(i+1)+'</span>';
  function row(t,ls){ var r=''; for(var i=0;i<n;i++) r+='<span class="c">'+(ls[i]!=null?esc(ls[i]):'·')+'</span>'; return '<div class="lr"><span class="c nm">'+esc(t.ab)+'</span>'+r+'<span class="c tot">'+esc(t.score)+'</span></div>'; }
  return '<div class="ls"><div class="lr h"><span class="c nm"></span>'+head+'<span class="c tot">T</span></div>'+row(g.away,a)+row(g.home,h)+'</div>';
}
// Final: top performers instead of a dead card
function keyStats(g){ var s=sumCache[g.id]; if(!s){ fetchSummary(g,true); return ''; } if(!s.leaders||!s.leaders.length) return '';
  return '<div class="key">'+s.leaders.slice(0,3).map(function(l){ return '<div><span class="lab">'+esc(l.ab)+'</span><b>'+esc(l.name)+'</b> '+esc(l.val)+'</div>'; }).join('')+'</div>'; }

function footer(g){
  var n=games.length, dots=''; if(n>1){ for(var i=0;i<n;i++) dots+='<i class="'+(i===idx?'on':'')+'"></i>'; }
  var nav = (n>1?'<span style="color:#ffcc00">◂</span> <span class="dots">'+dots+'</span> <span style="color:#ffcc00">▸</span>':'') + (g.state==='in'?'<span style="color:var(--muted);margin-left:6px">OK · plays</span>':'');
  var txt = (g.sport==='bb'||g.sport==='fb') ? trunc(g.last,42) : (g.level>=2?'🔔 every score':'');
  return '<div class="last"><span class="txt">'+esc(txt)+'</span><span class="nav">'+nav+'</span></div>';
}
function render(){
  var el=$('gc');
  if(!games.length){ el.className=''; el.innerHTML='<div class="msg">No starred games right now.<br><span style="font-size:.85em">Star games in Sports — or tell Claude "track the Knicks" — and they\'ll appear here.</span></div>'; return; }
  if(idx>=games.length) idx=0;
  var g=games[idx]; cur=g;
  var aLose=g.state==='post'&&g.home.winner, hLose=g.state==='post'&&g.away.winner;
  el.className=(g.closeLate?'close':g.hot?'hot':'')+(expanded?' exp':'');
  var head='<div class="hd"><span class="lg">'+esc(expanded?g.league.replace('GAMECAST','FULL'):g.league)+'</span>'+levTag(g)+statusLine(g)+'</div>';
  if(expanded){
    var sum=sumCache[g.id]||{};
    var tabs=['plays','away','home','team']; if(tab>=tabs.length) tab=0; var t=tabs[tab];
    var tabbar='<div class="tabs">'+tabs.map(function(x,i){ var lab=x==='plays'?'PLAYS':x==='away'?('BOX · '+g.away.ab):x==='home'?('BOX · '+g.home.ab):'TEAM'; return '<span class="'+(i===tab?'on':'')+'">'+esc(lab)+'</span>'; }).join('')+'<span class="hint">◂ ▸ tabs · ▴ ▾ scroll</span></div>';
    var body;
    if(t==='plays'){
      var sp=(sum.scoring||[]).slice(-7).reverse().map(function(p){ return '<div class="pl"><b>'+esc(p.ab||'')+'</b><span>'+esc(trunc(p.text,54))+'</span>'+(p.score?'<span class="sc">'+esc(p.score)+'</span>':'')+'</div>'; }).join('')||'<div style="color:#9aa7c2">No scoring plays yet</div>';
      var rp=(sum.plays||[]).slice(-6).reverse().map(function(p){ return '<div class="pl"><span>'+esc(trunc(p,60))+'</span></div>'; }).join('')||'';
      body=sitHTML(g)+wpBar(g)+'<div class="pbp"><div class="h">SCORING</div>'+sp+(rp?'<div class="h">RECENT</div>'+rp:'')+'</div>';
    } else if(t==='team'){ body=teamStats(g,sum); }
    else { body=boxScore(g,sum,t); }
    el.innerHTML=head+teamRow(g.away,aLose,g)+teamRow(g.home,hLose,g)+metaRow(g)+tabbar+
      '<div class="sit" id="sitbox" style="overflow:auto">'+body+'</div>'+
      '<div class="last"><span class="txt">'+(sum.loading?'Loading…':(g.state==='in'?'Live · updates every 15s':''))+'</span><span class="nav">Back · minimize</span></div>';
    var sb=$('sitbox'); if(sb) sb.scrollTop=scrollPos;
  } else {
    el.innerHTML=head+teamRow(g.away,aLose,g)+teamRow(g.home,hLose,g)+metaRow(g)+'<div class="sit">'+sitHTML(g)+wpBar(g)+'</div>'+footer(g);
  }
}

// ---- live box score (from ESPN summary boxscore) ----
var BOX_COLS={
  bk:{'*':['MIN','PTS','REB','AST','FG','3PT','FT','+/-']},
  hk:{forwards:['G','A','SOG','+/-','TOI','PIM'], defenses:['G','A','SOG','+/-','TOI','PIM'], skaters:['G','A','SOG','+/-','TOI','PIM'], goalies:['SA','SV','GA','SV%','TOI']},
  fb:{passing:['C/ATT','YDS','TD','INT','RTG'], rushing:['CAR','YDS','AVG','TD'], receiving:['REC','YDS','TD','TGTS'], defensive:['TOT','SACKS','TFL','PD'], kicking:['FG','XP','PTS']},
  bb:{batting:['AB','R','H','RBI','BB','K','AVG'], pitching:['IP','H','R','ER','BB','K','PC-ST']}
};
var GROUP_TITLE={forwards:'Forwards',defenses:'Defense',skaters:'Skaters',goalies:'Goalies',passing:'Passing',rushing:'Rushing',receiving:'Receiving',defensive:'Defense',kicking:'Kicking',batting:'Batting',pitching:'Pitching'};
function boxScore(g, sum, side){
  var box=sum.box; if(!box||!box.players){ return '<div class="msg" style="padding:14px">'+(sum.loading?'Loading box score…':(g.state==='pre'?'Box score appears at tip-off.':'No box score available.'))+'</div>'; }
  var want=side==='home'?g.home:g.away;
  var tm=(box.players||[]).filter(function(t){ return String((t.team||{}).id)===String(want.id) || (t.team||{}).abbreviation===want.ab; })[0]; if(!tm) return '<div class="msg">No data for '+esc(want.ab)+'</div>';
  var cols=BOX_COLS[g.sport]||{}; var out='';
  (tm.statistics||[]).forEach(function(grp,gi){
    var labels=grp.labels||grp.names||[]; var name=String(grp.name||'').toLowerCase();
    if(g.sport==='bb'){ name = labels.indexOf('IP')>=0?'pitching':'batting'; }
    var wantCols=cols[name]||cols['*']; if(!wantCols && (g.sport==='fb')) return; // skip minor NFL groups
    if(!wantCols) wantCols=labels.slice(0,7);
    var idxs=wantCols.map(function(c){ return labels.indexOf(c); }).filter(function(i){ return i>=0; }); if(!idxs.length) return;
    var aths=(grp.athletes||[]).slice(); if(!aths.length) return;
    // starters first, then bench, DNPs last
    aths.sort(function(a,b){ var ra=a.didNotPlay?2:(a.starter?0:1), rb=b.didNotPlay?2:(b.starter?0:1); return ra-rb; });
    var head='<div class="br h"><span class="bn">'+esc(GROUP_TITLE[name]||(name?name.toUpperCase():'PLAYERS'))+'</span>'+idxs.map(function(i){ return '<span class="bc">'+esc(labels[i])+'</span>'; }).join('')+'</div>';
    var rows=aths.map(function(a){ var at=a.athlete||{}; var nm=at.shortName||at.displayName||''; var pos=(at.position||{}).abbreviation||'';
      if(a.didNotPlay) return '<div class="br dnp"><span class="bn">'+esc(nm)+' <i>'+esc(pos)+'</i></span><span class="bc" style="grid-column:2/-1;text-align:left">DNP'+(a.reason?' · '+esc(trunc(a.reason,28)):'')+'</span></div>';
      return '<div class="br'+(a.starter?' st':'')+'"><span class="bn">'+esc(nm)+' <i>'+esc(pos)+'</i></span>'+idxs.map(function(i){ return '<span class="bc">'+esc((a.stats||[])[i]!=null?a.stats[i]:'–')+'</span>'; }).join('')+'</div>'; }).join('');
    // team totals row when ESPN provides one
    var tot=''; if(grp.totals&&grp.totals.length){ tot='<div class="br tot"><span class="bn">Team</span>'+idxs.map(function(i){ return '<span class="bc">'+esc(grp.totals[i]!=null?grp.totals[i]:'')+'</span>'; }).join('')+'</div>'; }
    out+='<div class="box" style="--n:'+idxs.length+'">'+head+rows+tot+'</div>';
  });
  return out||'<div class="msg">Box score not available yet.</div>';
}
function teamStats(g, sum){
  var box=sum.box; if(!box||!box.teams||box.teams.length<2) return '<div class="msg" style="padding:14px">'+(sum.loading?'Loading…':'Team stats appear once the game starts.')+'</div>';
  var A=box.teams.filter(function(t){ return String((t.team||{}).id)===String(g.away.id); })[0]||box.teams[0];
  var H=box.teams.filter(function(t){ return String((t.team||{}).id)===String(g.home.id); })[0]||box.teams[1];
  var rows=''; (A.statistics||[]).forEach(function(s,i){ var h=(H.statistics||[])[i]||{}; var lab=s.label||s.name||''; if(!lab||s.displayValue==null) return;
    var av=parseFloat(s.displayValue), hv=parseFloat(h.displayValue); var aw=(!isNaN(av)&&!isNaN(hv)&&av>hv), hw=(!isNaN(av)&&!isNaN(hv)&&hv>av);
    rows+='<div class="ts"><span class="'+(aw?'w':'')+'">'+esc(s.displayValue)+'</span><span class="l">'+esc(lab)+'</span><span class="'+(hw?'w':'')+'">'+esc(h.displayValue!=null?h.displayValue:'–')+'</span></div>'; });
  return '<div class="ts h"><span style="color:'+col(g.away)+'">'+esc(g.away.ab)+'</span><span class="l">TEAM STATS</span><span style="color:'+col(g.home)+'">'+esc(g.home.ab)+'</span></div>'+rows;
}

// summary: scoring plays, recent plays, win prob, team fouls, leaders, current run, box score
function fetchSummary(g, quiet){
  if(sumCache[g.id]&&!sumCache[g.id].loading&&Date.now()-(sumCache[g.id].t||0)<15000){ if(!quiet) render(); return; }
  if(!sumCache[g.id]) sumCache[g.id]={loading:true}; if(!quiet) render();
  fetch(ESPN+g.lg+'/summary?event='+g.id).then(function(r){return r.json();}).then(function(d){
    var scoring=(d.scoringPlays||[]).map(function(p){ return {ab:(p.team&&p.team.abbreviation)||'', text:p.text||((p.type&&p.type.text)||''), score:(p.awayScore!=null?p.awayScore+'–'+p.homeScore:'')}; });
    var plays=(d.plays||[]).slice(-10).map(function(p){ return p.text||''; }).filter(Boolean);
    var wp=null, wpa=d.winprobability; if(wpa&&wpa.length){ var L=wpa[wpa.length-1]; if(L&&L.homeWinPercentage!=null){ wp={home:Math.round(L.homeWinPercentage*100)}; wp.away=100-wp.home; } }
    // team fouls
    var fouls=null; try{ var tms=(d.boxscore&&d.boxscore.teams)||[]; var f={}; tms.forEach(function(t){ var st=(t.statistics||[]).filter(function(x){ return /^(fouls|totalFouls|personalFouls)$/i.test(x.name||''); })[0]; if(st){ f[(t.homeAway||'')]=+st.displayValue||0; } }); if(f.home!=null&&f.away!=null) fouls=f; }catch(e){}
    // leaders (Final key stats)
    var leaders=[]; try{ (d.leaders||[]).forEach(function(tl){ var ab=(tl.team&&tl.team.abbreviation)||''; (tl.leaders||[]).slice(0,1).forEach(function(cat){ var l=(cat.leaders||[])[0]; if(l&&l.athlete){ leaders.push({ab:ab, name:l.athlete.shortName||l.athlete.displayName, val:l.displayValue||''}); } }); }); }catch(e){}
    // current unanswered run from the play list
    var run=null; try{ var pl=d.plays||[]; var lastTeam=null, pts=0, la=null, lh=null;
      for(var i=0;i<pl.length;i++){ var p=pl[i]; if(!p.scoringPlay) continue; var tid=p.team&&p.team.id; var val=+p.scoreValue||0; if(!val) continue;
        if(tid===lastTeam) pts+=val; else { lastTeam=tid; pts=val; } }
      if(lastTeam) run={team:lastTeam, pts:pts}; }catch(e){}
    sumCache[g.id]={t:Date.now(), scoring:scoring, plays:plays, fouls:fouls, leaders:leaders, box:d.boxscore||null};
    games.forEach(function(x){ if(x.id===g.id){ if(wp) x.wp=wp; x.run=run; } });
    render();
  }).catch(function(){ sumCache[g.id]={t:Date.now(), scoring:[],plays:[]}; render(); });
}

function load(){
  var st=getStarred();
  window.__gc_starred=st.length;
  if(!st.length){ games=[]; render(); return Promise.resolve(); }
  var leagues=[]; st.forEach(function(s){ if(leagues.indexOf(s.lg)<0) leagues.push(s.lg); });
  return loadScoreboards(leagues).then(function(byLg){
    var out=[];
    st.forEach(function(s){ var evs=byLg[s.lg]||[]; var e=evs.filter(function(x){return String(x.id)===String(s.id);})[0]; if(e){ var g=normalize(s.lg,e); if(g){ var old=games.filter(function(x){return x.id===g.id;})[0]; if(old){ g.wp=old.wp; g.run=old.run; } out.push(g); } } });
    // live first; within live, close-and-late games first (auto-promote), then upcoming, then finals
    var rank={in:0,pre:1,post:2};
    out.sort(function(a,b){ var r=(rank[a.state]==null?3:rank[a.state])-(rank[b.state]==null?3:rank[b.state]); if(r) return r; return (b.closeLate?1:0)-(a.closeLate?1:0); });
    games=out; window.__gc_games=games.length;
    if(cur){ var ni=games.map(function(g){return g.id;}).indexOf(cur.id); if(ni>=0) idx=ni; }
    // auto-promote: when a game first turns close-and-late during auto-switch, jump to it once
    if(GC_CYCLE>0 && !expanded){ for(var i=0;i<games.length;i++){ if(games[i].closeLate && !promoted[games[i].id]){ promoted[games[i].id]=1; idx=i; cur=games[i]; resetCycle(); break; } } }
    render();
    // keep run / fouls fresh for live basketball & football cards
    games.forEach(function(g){ if(g.state==='in' && (g.sport==='bk'||g.sport==='fb') && (!sumCache[g.id] || Date.now()-(sumCache[g.id].t||0)>45000)) fetchSummary(g,true); });
  });
}
function poll(){ clearTimeout(pollT); if(expanded&&cur&&cur.state==='in'){ fetchSummary(cur,true); } load().then(function(){ var live=games.some(function(g){return g.state==='in';}); pollT=setTimeout(poll, live?12000:45000); }); }

document.addEventListener('keydown',function(e){
  var k=e.keyCode||e.which;
  if(expanded){
    var sb=$('sitbox');
    if(k===8||k===4||k===27){ expanded=false; tab=0; scrollPos=0; render(); e.preventDefault(); }
    else if(k===39){ tab=(tab+1)%4; scrollPos=0; render(); e.preventDefault(); }
    else if(k===37){ tab=(tab+3)%4; scrollPos=0; render(); e.preventDefault(); }
    else if(k===40){ if(sb){ sb.scrollTop+=120; scrollPos=sb.scrollTop; } e.preventDefault(); }
    else if(k===38){ if(sb){ sb.scrollTop-=120; scrollPos=sb.scrollTop; } e.preventDefault(); }
    else if(k===13||k===23||k===66){ tab=(tab+1)%4; scrollPos=0; render(); e.preventDefault(); }
    return; }
  if(k===39){ if(games.length>1){ idx=(idx+1)%games.length; cur=games[idx]; render(); resetCycle(); e.preventDefault(); } }
  else if(k===37){ if(games.length>1){ idx=(idx-1+games.length)%games.length; cur=games[idx]; render(); resetCycle(); e.preventDefault(); } }
  else if(k===13||k===23||k===66){ if(cur){ expanded=true; tab=0; scrollPos=0; fetchSummary(cur); e.preventDefault(); } }
});
var GC_CYCLE=parseInt((location.search.match(/[?&]cycle=(\d+)/)||[])[1]||0,10);
try{ if(!GC_CYCLE) GC_CYCLE=parseInt(localStorage.getItem('w2w.gcCycle')||'0',10)||0; }catch(e){}
var cycleT=null;
function resetCycle(){ clearTimeout(cycleT); if(GC_CYCLE>0){ cycleT=setTimeout(function tick(){ if(!expanded&&games.length>1){ idx=(idx+1)%games.length; cur=games[idx]; render(); } cycleT=setTimeout(tick, GC_CYCLE*1000); }, GC_CYCLE*1000); } }
resetCycle();
window.addEventListener('storage', function(e){ if(!e.key || /^w2w\.(starred|starLevel|ovOpacity|gcCycle)$/.test(e.key)){ applyOpacity(); try{ GC_CYCLE=parseInt(localStorage.getItem('w2w.gcCycle')||'0',10)||0; }catch(x){} resetCycle(); load(); } });
window.W2W_BACK=function(){ if(expanded){ expanded=false; render(); return true; } try{ history.back(); }catch(e){ location.href='./'; } return true; };
window.GC={ next:function(){if(!expanded&&games.length){idx=(idx+1)%games.length;cur=games[idx];render();}},
  prev:function(){if(!expanded&&games.length){idx=(idx-1+games.length)%games.length;cur=games[idx];render();}},
  ok:function(){ if(expanded){ tab=(tab+1)%4; scrollPos=0; render(); } else if(cur){expanded=true;tab=0;scrollPos=0;fetchSummary(cur);} }, tab:function(n){ if(expanded){ tab=((n%4)+4)%4; scrollPos=0; render(); } },
  back:function(){ if(expanded){expanded=false;render();} }, reload:load };
// boot: pull in games Mike asked Claude to track (and prop/parlay games), then poll
(window.W2W_FOLLOW?W2W_FOLLOW.sync():Promise.resolve()).catch(function(){}).then(poll);
setInterval(function(){ if(window.W2W_FOLLOW) W2W_FOLLOW.sync().then(function(r){ if(r&&r.added) load(); }); }, 5*60*1000);
</script>
