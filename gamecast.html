<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gamecast</title>
<style>
  :root{--line:#232d41;--muted:#9aa7c2;--gold:#ffcc00;--green:#2ec47a;--red:#e5533c;--blue:#4f9bff;--sans:'Segoe UI',system-ui,Roboto,Arial,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:transparent;font-family:var(--sans);overflow:hidden}
  /* panel sizes to its container; the native overlay sets the window size */
  #gc{width:100%;height:100%;background:linear-gradient(180deg,#0e1726,#0a0f1a);border:1px solid var(--line);border-radius:14px;overflow:hidden;color:#eef3fb;box-shadow:0 20px 55px -18px #000;display:flex;flex-direction:column;font-size:min(3.6vw,15px)}
  .hd{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(255,204,0,.12),transparent);flex:none}
  .hd .lg{font-weight:800;letter-spacing:.09em;font-size:.72em;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hd .status{font-size:.72em;font-weight:700;display:flex;align-items:center;gap:5px;flex:none;color:var(--muted)}
  .hd .status.live{color:var(--red)}
  .hd .status .dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .tm{display:flex;align-items:center;gap:9px;padding:6px 12px;flex:none}
  .tm .lgo{width:26px;height:26px;border-radius:50%;background:#fff;object-fit:contain;flex:none;padding:2px;box-sizing:border-box}
  .tm .ab{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex:none}
  .tm .nm{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tm .nm .rec{color:var(--muted);font-size:.78em;font-weight:400;margin-left:5px}
  .tm .pts{font-size:1.7em;font-weight:300;min-width:30px;text-align:right}
  .tm.bat .nm:after{content:"▪";color:var(--gold);margin-left:6px;font-size:.7em;vertical-align:1px}
  .tm .pos{color:var(--gold);margin-left:4px}
  .sit{border-top:1px solid var(--line);padding:8px 12px;flex:1;overflow:hidden}
  .chip{display:inline-flex;align-items:center;gap:4px;background:#182134;border:1px solid var(--line);border-radius:7px;padding:2px 7px;font-size:.78em;margin:2px 3px 2px 0}
  .chip b{color:#fff}
  .last{border-top:1px solid var(--line);padding:6px 12px;font-size:.78em;color:var(--muted);display:flex;align-items:center;gap:7px;flex:none;min-height:28px}
  .last .nav{margin-left:auto;color:var(--gold);font-size:.92em;font-weight:600;flex:none}
  .wp{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:.78em}
  .wp .bar{flex:1;height:7px;border-radius:5px;overflow:hidden;display:flex;background:#1b2436}
  .wp .bar i{height:100%;transition:width .9s}
  .wp .pct{font-weight:700;min-width:30px}
  /* baseball */
  .bbw{display:flex;gap:10px;align-items:flex-start}
  .diamond{width:54px;height:54px;position:relative;flex:none;margin-top:2px}
  .diamond .b{position:absolute;width:13px;height:13px;background:#223049;border:1.5px solid #3b4a6b;transform:rotate(45deg)}
  .diamond .b.on{background:var(--gold);border-color:#fff}
  .diamond .b2{top:0;left:20px}.diamond .b1{top:20px;right:0}.diamond .b3{top:20px;left:0}
  .zone{width:50px;height:64px;position:relative;background:#0a1019;border:1px solid #2b3550;border-radius:4px;flex:none}
  .zone .grid{position:absolute;inset:10px 8px 16px 8px;border:1.5px solid rgba(255,255,255,.5)}
  .zone .grid:before{content:"";position:absolute;left:33%;right:33%;top:0;bottom:0;border-left:1px solid rgba(255,255,255,.22);border-right:1px solid rgba(255,255,255,.22)}
  .zone .grid:after{content:"";position:absolute;top:33%;bottom:33%;left:0;right:0;border-top:1px solid rgba(255,255,255,.22);border-bottom:1px solid rgba(255,255,255,.22)}
  .cnt{font-size:.78em;display:flex;flex-direction:column;gap:4px}
  .cnt .r{display:flex;align-items:center;gap:5px}.cnt .r span{width:12px;color:var(--muted);font-weight:700}
  .pip{width:8px;height:8px;border-radius:50%;background:#26324a;border:1px solid #3a4a6b}
  .pip.b{background:var(--green);border-color:var(--green)}.pip.s{background:var(--gold);border-color:var(--gold)}.pip.o{background:var(--red);border-color:var(--red)}
  /* football field */
  .field{position:relative;height:46px;border-radius:5px;overflow:hidden;border:1px solid #1f3a28;margin-top:2px}
  .field .turf{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#123a23 0 9.09%,#0f3420 9.09% 18.18%)}
  .field .ez{position:absolute;top:0;bottom:0;width:9%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:800;color:rgba(255,255,255,.85);writing-mode:vertical-rl}
  .field .los{position:absolute;top:0;bottom:0;width:2px;background:var(--blue);transition:left .8s}
  .field .fd{position:absolute;top:0;bottom:0;width:2px;background:var(--gold);transition:left .8s}
  .field .ball{position:absolute;top:50%;width:11px;height:7px;background:#7a4a22;border:1px solid #c98b4a;border-radius:50%;transform:translate(-50%,-50%);transition:left .8s}
  .to{display:inline-flex;gap:3px;align-items:center}.to i{width:7px;height:7px;border-radius:50%;background:#2a3651;border:1px solid #41557d}.to i.on{background:var(--gold);border-color:var(--gold)}
  .msg{padding:20px;text-align:center;color:var(--muted);font-size:.9em}
  .count{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:.7em;color:var(--muted);background:rgba(8,12,30,.7);padding:1px 8px;border-radius:8px}
  /* expanded */
  #gc.exp{font-size:min(3.2vw,14px)}
  .pbp{font-size:.82em;color:#c7d0e4;display:grid;gap:5px;overflow:auto;max-height:100%}
  .pbp .h{font-size:.82em;font-weight:800;letter-spacing:.08em;color:var(--gold);margin:8px 0 3px}
</style></head>
<body>
<div id="gc"><div class="msg">Loading your games…</div></div>
<script>
var ESPN='https://site.api.espn.com/apis/site/v2/sports/';
function $(id){return document.getElementById(id);}
function getStarred(){ try{ var a=JSON.parse(localStorage.getItem('w2w.starred')||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function col(t){ return '#'+((t.color&&t.color.length>=6)?t.color:'334155'); }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function ord(n){return n+({1:'st',2:'nd',3:'rd'}[n%100>10&&n%100<14?0:n%10]||'th');}

var games=[], idx=0, expanded=false, cur=null, pollT=null;

function sportOf(lg){ if(/football/.test(lg))return'fb'; if(/baseball/.test(lg))return'bb'; if(/basketball/.test(lg))return'bk'; if(/hockey/.test(lg))return'hk'; if(/soccer/.test(lg))return'sc'; if(/tennis/.test(lg))return'tn'; return'gen'; }
function lgLabel(lg){ var m={'football/nfl':'NFL','basketball/nba':'NBA','baseball/mlb':'MLB','hockey/nhl':'NHL','football/college-football':'NCAAF','basketball/mens-college-basketball':'NCAAM'}; return (m[lg]||lg.split('/').pop().toUpperCase())+' · GAMECAST'; }

function fetchGame(s){
  return fetch(ESPN+s.lg+'/summary?event='+s.id).then(function(r){return r.json();}).then(function(d){
    try{ return normalize(s.lg, d, s); }catch(e){ return null; }
  }).catch(function(){ return null; });
}
function normalize(lg, d, s){
  var h=d.header||{}, comp=(h.competitions&&h.competitions[0])||{};
  var cs=comp.competitors||[]; if(cs.length<2) return null;
  var home=cs.filter(function(x){return x.homeAway==='home';})[0]||cs[0];
  var away=cs.filter(function(x){return x.homeAway==='away';})[0]||cs[1];
  var st=comp.status||{}, state=(st.type||{}).state||'pre';
  var sit=comp.situation||d.situation||{};
  function team(t){ var tm=t.team||{}; return {ab:tm.abbreviation||'',name:tm.shortDisplayName||tm.name||tm.displayName||'',score:t.score,
    logo:(tm.logos&&tm.logos[0]&&tm.logos[0].href)||tm.logo||'', color:tm.color||'', id:tm.id,
    rec:((t.record||[])[0]||{}).displayValue||'', poss:sit.possession&&sit.possession===tm.id, winner:t.winner }; }
  var wp=null, wpa=d.winprobability; if(wpa&&wpa.length){ var last=wpa[wpa.length-1]; if(last&&last.homeWinPercentage!=null){ wp={home:Math.round(last.homeWinPercentage*100)}; wp.away=100-wp.home; } }
  return { lg:lg, id:s.id, sport:sportOf(lg), league:lgLabel(lg), state:state,
    statusTxt:(st.type||{}).shortDetail||(st.type||{}).description||'', clock:st.displayClock||'', period:st.period,
    away:team(away), home:team(home), sit:sit, last:(sit.lastPlay||{}).text||'', wp:wp,
    scoringPlays:d.scoringPlays||[], plays:d.plays||[] };
}

function teamRow(t, batSide){
  var logo=t.logo?'<img class="lgo" src="'+esc(t.logo)+'">':'<span class="ab" style="background:'+col(t)+'">'+esc(t.ab)+'</span>';
  return '<div class="tm'+(batSide?' bat':'')+'">'+logo+'<span class="nm">'+esc(t.name)+(t.rec?'<span class="rec">'+esc(t.rec)+'</span>':'')+'</span>'+(t.poss?'<span class="pos">●</span>':'')+'<span class="pts">'+esc(t.score)+'</span></div>';
}
function wpBar(g){ if(!g.wp) return ''; return '<div class="wp"><span class="pct" style="color:'+col(g.away)+'">'+g.wp.away+'%</span><div class="bar"><i style="width:'+g.wp.away+'%;background:'+col(g.away)+'"></i><i style="width:'+g.wp.home+'%;background:'+col(g.home)+'"></i></div><span class="pct" style="text-align:right;color:'+col(g.home)+'">'+g.wp.home+'%</span></div>'; }
function statusLine(g){ var live=g.state==='in'; return '<span class="status'+(live?' live':'')+'">'+(live?'<span class="dot"></span>':'')+esc(g.statusTxt||(g.state==='post'?'Final':''))+'</span>'; }

function sitHTML(g){
  var s=g.sit||{};
  if(g.sport==='bb'){
    function pips(n,on,cls){var o='';for(var i=0;i<n;i++)o+='<span class="pip '+(i<on?cls:'')+'"></span>';return o;}
    var bat=(s.batter&&s.batter.athlete&&(s.batter.athlete.shortName||s.batter.athlete.displayName))||'';
    var pit=(s.pitcher&&s.pitcher.athlete&&(s.pitcher.athlete.shortName||s.pitcher.athlete.displayName))||'';
    return '<div class="bbw"><div class="diamond"><div class="b b2'+(s.onSecond?' on':'')+'"></div><div class="b b1'+(s.onFirst?' on':'')+'"></div><div class="b b3'+(s.onThird?' on':'')+'"></div></div>'+
      '<div class="zone"><div class="grid"></div>'+batsil()+'</div>'+
      '<div class="cnt"><div class="r"><span>B</span>'+pips(4,s.balls||0,'b')+'</div><div class="r"><span>S</span>'+pips(3,s.strikes||0,'s')+'</div><div class="r"><span>O</span>'+pips(3,s.outs||0,'o')+'</div>'+
      (bat?'<div style="margin-top:2px"><b>'+esc(bat)+'</b></div>':'')+(pit?'<div style="color:#9aa7c2">P '+esc(pit)+'</div>':'')+'</div></div>'+wpBar(g);
  }
  if(g.sport==='fb'){
    var dd=s.shortDownDistanceText||s.downDistanceText||'', spot=s.possessionText||'', rz=s.isRedZone;
    var yl=(s.yardLine!=null)?s.yardLine:50, ball=9+((100-Math.max(0,Math.min(100,yl)))/100)*82; // approx
    var fd=ball+ (s.distance?Math.min(20,s.distance):10)*0.82;
    return '<div class="field"><div class="turf"></div><div class="ez" style="left:0;background:'+col(g.away)+'">'+esc(g.away.ab)+'</div><div class="ez" style="right:0;background:'+col(g.home)+'">'+esc(g.home.ab)+'</div>'+
      '<div class="los" style="left:'+ball+'%"></div><div class="fd" style="left:'+Math.min(99,fd)+'%"></div><div class="ball" style="left:'+ball+'%"></div></div>'+
      '<div style="margin-top:7px">'+(dd?'<span class="chip'+(rz?'" style="border-color:#e5533c"':'"')+'><b>'+esc(dd)+'</b></span>':'')+(spot?'<span class="chip">'+esc(spot)+'</span>':'')+(rz?'<span class="chip" style="color:#ff8f7d">RED ZONE</span>':'')+'</div>'+wpBar(g);
  }
  if(g.sport==='bk'){ return '<div>'+(g.last?'<span class="chip">'+esc(trunc(g.last,46))+'</span>':'<span class="chip">'+esc(g.statusTxt)+'</span>')+'</div>'+wpBar(g); }
  if(g.sport==='hk'){ return '<div>'+(g.last?'<span class="chip">'+esc(trunc(g.last,46))+'</span>':'')+(s.lastPlay&&/power play|man adv/i.test(s.lastPlay.text||'')?'<span class="chip" style="color:#ffcc00">⚡ Power play</span>':'')+'</div>'+wpBar(g); }
  if(g.sport==='sc'){ return '<div>'+(g.last?'<span class="chip">'+esc(trunc(g.last,46))+'</span>':'<span class="chip">'+esc(g.statusTxt)+'</span>')+'</div>'+wpBar(g); }
  if(g.sport==='tn'){ return '<div><span class="chip">'+esc(g.statusTxt||'In progress')+'</span></div>'; }
  return '<div><span class="chip">'+esc(g.statusTxt)+'</span></div>'+wpBar(g);
}
function trunc(s,n){ s=String(s||''); return s.length>n?s.slice(0,n-1)+'…':s; }
function batsil(){ return '<svg width="20" height="42" viewBox="0 0 100 200" style="position:absolute;right:-18px;bottom:0" fill="#5f6d8a"><g><path d="M60 44 L90 8 Q93 4 96 7 Q99 10 96 14 L66 50 Z"/><circle cx="63" cy="47" r="6"/><path d="M38 30 a13 13 0 0 1 26 0 a13 13 0 0 1 -26 0 z"/><path d="M37 31 q-2 -17 15 -19 q18 -2 15 10 q-1 4 -4 3 q-3 -8 -13 -7 q-11 1 -11 12 q0 3 -2 1 z"/><path d="M44 42 q-7 10 -6 24 q0 10 4 20 l22 -2 q5 -16 0 -32 q-3 -12 -8 -16 q-6 0 -12 6 z"/><path d="M42 84 q14 8 28 0 q3 10 -2 18 l-24 0 q-5 -9 -2 -18 z"/></g><path d="M50 52 Q66 54 70 42 Q72 36 64 34" stroke="#5f6d8a" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M48 98 Q40 120 44 136 Q46 150 40 170" stroke="#5f6d8a" stroke-width="15" fill="none" stroke-linecap="round"/><path d="M64 98 Q74 118 72 136 Q70 152 78 172" stroke="#55617a" stroke-width="15" fill="none" stroke-linecap="round"/></svg>'; }

function render(){
  var el=$('gc');
  if(!games.length){ el.innerHTML='<div class="msg">No starred games are live right now.<br><span style="font-size:.85em">Star games in Sports to see them here.</span></div>'; return; }
  if(idx>=games.length) idx=0;
  var g=games[idx]; cur=g;
  var batAway=g.sport==='bb' && g.sit && (g.sit.batter? false : false);
  var nav= games.length>1 ? '<span style="color:#ffcc00">◂</span> '+esc(g.away.ab)+'–'+esc(g.home.ab)+' <span style="color:#ffcc00">▸</span>' : '';
  if(expanded){
    el.className='exp';
    var sp=(g.scoringPlays||[]).slice(-6).reverse().map(function(p){ var t=(p.team||{}).abbreviation||''; return '<div><b>'+esc(t)+'</b> '+esc(trunc(p.text,60))+(p.awayScore!=null?' <span style="color:#9aa7c2;float:right">'+p.awayScore+'–'+p.homeScore+'</span>':'')+'</div>'; }).join('')||'<div style="color:#9aa7c2">No scoring plays yet</div>';
    var rp=(g.plays||[]).slice(-6).reverse().map(function(p){ return '<div>'+esc(trunc(p.text,66))+'</div>'; }).join('')||'';
    el.innerHTML='<div class="hd"><span class="lg">'+esc(g.league.replace('GAMECAST','FULL'))+'</span>'+statusLine(g)+'</div>'+
      teamRow(g.away)+teamRow(g.home, g.away.poss?false:false)+
      '<div class="sit" style="overflow:auto">'+sitHTML(g)+'<div class="pbp"><div class="h">SCORING PLAYS</div>'+sp+(rp?'<div class="h">RECENT PLAYS</div>'+rp:'')+'</div></div>'+
      '<div class="last">'+(g.wp?'Win prob: '+(g.wp.home>=g.wp.away?esc(g.home.ab)+' '+g.wp.home:esc(g.away.ab)+' '+g.wp.away)+'%':'')+'<span class="nav">Back · minimize</span></div>';
  } else {
    el.className='';
    el.innerHTML='<div class="hd"><span class="lg">'+esc(g.league)+'</span>'+statusLine(g)+'</div>'+
      teamRow(g.away, g.sport==='bb'&&!g.home.poss)+teamRow(g.home)+
      '<div class="sit">'+sitHTML(g)+'</div>'+
      '<div class="last"><span>'+esc(trunc(g.last,42))+'</span><span class="nav">'+(nav||'OK · plays')+'</span></div>';
  }
}

function load(){
  var st=getStarred();
  if(!st.length){ games=[]; render(); return Promise.resolve(); }
  return Promise.all(st.map(fetchGame)).then(function(res){
    var all=res.filter(Boolean);
    // keep live first, then pre/post; prefer live
    var live=all.filter(function(g){return g.state==='in';});
    games = live.length ? live : all;
    if(cur){ var ni=games.map(function(g){return g.id;}).indexOf(cur.id); if(ni>=0) idx=ni; }
    render();
  });
}
function poll(){ clearTimeout(pollT); load().then(function(){ var live=games.some(function(g){return g.state==='in';}); pollT=setTimeout(poll, live?12000:40000); }); }

document.addEventListener('keydown',function(e){
  var k=e.keyCode||e.which;
  if(k===39){ if(games.length>1 && !expanded){ idx=(idx+1)%games.length; cur=games[idx]; render(); e.preventDefault(); } }
  else if(k===37){ if(games.length>1 && !expanded){ idx=(idx-1+games.length)%games.length; cur=games[idx]; render(); e.preventDefault(); } }
  else if(k===13||k===23||k===66){ expanded=!expanded; render(); e.preventDefault(); } // OK toggles expand
  else if(k===8||k===4){ if(expanded){ expanded=false; render(); e.preventDefault(); } } // Back minimizes
});
// allow the native host to drive it too
window.GC={ next:function(){idx=(idx+1)%Math.max(1,games.length);cur=games[idx];render();}, prev:function(){idx=(idx-1+Math.max(1,games.length))%Math.max(1,games.length);cur=games[idx];render();}, toggle:function(){expanded=!expanded;render();}, reload:load };
poll();
</script>
</body></html>
